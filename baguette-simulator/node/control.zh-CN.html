<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>iOS 模拟器</title>
<link rel="stylesheet" href="/control.css">
<header class="bar" role="toolbar">
  <button class="pill" id="device-chip" aria-haspopup="menu" aria-expanded="false"><span class="dot" id="chip-dot" data-tone="busy"></span><span class="name" id="chip-name">…</span><svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
  <div class="title" id="title" hidden><span class="dot" id="title-dot" data-tone="busy"></span><span class="text"><strong id="title-name"></strong><span id="title-sub"></span></span></div>
  <span class="sr" id="status" role="status" aria-live="polite"></span>
  <span class="grow"></span>
  <div class="zoom" id="zoom" role="group">
    <button class="icon-btn" id="zoom-out"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button class="zoom-label" id="zoom-label" aria-haspopup="menu" aria-expanded="false"></button>
    <button class="icon-btn" id="zoom-in"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
  </div>
  <button class="icon-btn" id="btn-more" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
</header>
<main class="stage" id="stage">
  <div class="scroll" id="scroll"><div class="frame" id="frame"><iframe id="screen" title="iOS 模拟器" allow="clipboard-read; clipboard-write"></iframe></div></div>
  <div class="overlay" id="overlay" hidden></div>
  <div class="dock" id="dock"></div>
  <div class="tools" id="tools" role="toolbar" hidden>
    <div class="tool-group">
      <button class="tool" id="btn-home"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
      <button class="tool" id="btn-shot"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></button>
    </div>
    <div class="tool-group">
      <button class="tool" id="btn-rotl"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button class="tool" id="btn-rotr"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
    </div>
    <div class="tool-group" id="posture" role="radiogroup" hidden>
      <button class="tool" data-pose="shut" role="radio"><svg viewBox="0 0 20 16" width="20" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="6.5" y="1.5" width="7" height="13" rx="1.8"/></svg></button>
      <button class="tool" data-pose="open" role="radio"><svg viewBox="0 0 20 16" width="20" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2.5 1.5 10 3.6l7.5-2.1v13L10 12.4l-7.5 2.1z"/><path d="M10 3.6v8.8"/></svg></button>
      <button class="tool" data-pose="flat" role="radio"><svg viewBox="0 0 20 16" width="20" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="1.5" y="2" width="17" height="12" rx="1.8"/><path d="M10 2v12" stroke-dasharray="1.5 2" stroke-width="1"/></svg></button>
    </div>
  </div>
</main>
<dialog id="device-dialog"><form id="device-form" method="dialog"><h2 id="dialog-title"></h2><p class="hint" id="dialog-hint"></p>
<label id="f-name-label"><span id="f-name-text"></span><input id="f-name" maxlength="80" required autocomplete="off"></label>
<label id="f-model-label"><span id="f-model-text"></span><select id="f-model"></select></label>
<label id="f-runtime-label"><span id="f-runtime-text"></span><select id="f-runtime"></select></label>
<p class="error" id="dialog-error" role="alert"></p>
<div class="row"><button type="button" class="btn secondary" id="dialog-cancel"></button><button type="submit" class="btn cta" id="dialog-save"></button></div></form></dialog>
<dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p class="hint" id="confirm-body"></p><div class="row"><button type="button" class="btn secondary" id="confirm-cancel"></button><button type="button" class="btn danger" id="confirm-ok"></button></div></dialog>
<script src="/control-model.js"></script><script src="/control.js"></script></html>
