<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baguette 模拟器</title>
<link rel="stylesheet" href="/control.css">
<header><strong>Baguette</strong><span id="status" role="status">正在检查设备…</span><label>画面大小 <select id="zoom" aria-label="画面大小"><option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><button id="release">解除卡键</button><button id="recover">恢复画面</button><button id="shutdown" class="danger">关闭设备</button></header><div class="hint">关闭设备会结束 App 和连接，保留数据。 <span id="idle"></span></div><div id="notice" role="status"></div><div id="viewport"><div id="stage"><iframe id="screen" title="iOS 模拟器" allow="clipboard-read; clipboard-write"></iframe></div></div>
<script src="/control.js"></script></html>
